<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Ontologia base del Step 1</title>
  <desc id="desc">Diagrama base de la ontologia de financiacion cientifica con papers, personas, organizaciones, proyectos, paises, topics y similitudes.</desc>
  <style>
    .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 10; }
    .core { fill: #e0f2fe; }
    .funding { fill: #dcfce7; }
    .topic { fill: #fef3c7; }
    .text { font-family: Arial, sans-serif; font-size: 17px; fill: #111827; font-weight: 700; text-anchor: middle; }
    .small { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; text-anchor: middle; }
    .edge { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #111827; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
  </defs>

  <rect x="390" y="210" width="200" height="82" class="box core"/>
  <text x="490" y="245" class="text">g4:Paper</text>
  <text x="490" y="268" class="small">titulo, fecha, abstract</text>

  <rect x="80" y="70" width="190" height="78" class="box core"/>
  <text x="175" y="104" class="text">foaf:Person</text>
  <text x="175" y="127" class="small">autor / persona reconocida</text>

  <rect x="80" y="355" width="220" height="78" class="box funding"/>
  <text x="190" y="389" class="text">schema:Organization</text>
  <text x="190" y="412" class="small">financiador / entidad</text>

  <rect x="420" y="355" width="180" height="78" class="box funding"/>
  <text x="510" y="389" class="text">schema:Project</text>
  <text x="510" y="412" class="small">grant, fechas, fundingAmount</text>

  <rect x="750" y="355" width="150" height="78" class="box funding"/>
  <text x="825" y="389" class="text">schema:Country</text>
  <text x="825" y="412" class="small">pais del organismo</text>

  <rect x="735" y="70" width="150" height="78" class="box topic"/>
  <text x="810" y="104" class="text">g4:Topic</text>
  <text x="810" y="127" class="small">keywords</text>

  <rect x="630" y="205" width="215" height="72" class="box topic"/>
  <text x="737" y="237" class="text">g4:PaperTopicSimilarity</text>
  <text x="737" y="259" class="small">paper, topic, score</text>

  <rect x="380" y="70" width="220" height="78" class="box topic"/>
  <text x="490" y="104" class="text">g4:PaperSimilarity</text>
  <text x="490" y="127" class="small">paper1, paper2, score</text>

  <path d="M270 109 C330 125 350 205 390 230" class="edge"/>
  <text x="313" y="167" class="label">schema:author</text>

  <path d="M270 395 C325 360 360 300 390 270" class="edge"/>
  <text x="327" y="334" class="label">g4:acknowledges</text>

  <path d="M420 394 C385 360 380 310 420 284" class="edge"/>
  <text x="386" y="330" class="label">g4:fundedByProject</text>

  <path d="M420 394 L300 394" class="edge"/>
  <text x="360" y="382" class="label">schema:funder</text>

  <path d="M300 394 L750 394" class="edge"/>
  <text x="660" y="382" class="label">schema:location</text>

  <path d="M590 250 L630 240" class="edge"/>
  <text x="610" y="228" class="label">g4:paper</text>

  <path d="M772 205 L802 148" class="edge"/>
  <text x="822" y="179" class="label">g4:topic</text>

  <path d="M490 148 L490 210" class="edge"/>
  <text x="538" y="183" class="label">paper1/paper2</text>

  <path d="M175 148 L180 355" class="edge"/>
  <text x="105" y="260" class="label">schema:affiliation</text>
</svg>
